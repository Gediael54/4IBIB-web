name: Lighthouse CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/iron
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pra ativar este job, garanta que `@lhci/cli` esteja disponivel via npx (sem
      # precisar instalar local). O comando abaixo baixa a CLI on-demand. Caso queira
      # versao fixa, adicione `@lhci/cli@<versao>` em devDependencies e troque pra
      # `npx lhci autorun ...`.
      - name: Lighthouse CI autorun
        run: npx --yes @lhci/cli@latest autorun --collect.staticDistDir=./dist
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
